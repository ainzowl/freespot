name: Deploy to GitHub Pages

# FreePot is a static app, so deploying is just publishing the folder: no build
# step, no secrets. The download provider key ships inside `assets/js/config.js`
# on purpose, so it is public either way and Pages changes nothing about that.
#
# Pages does not have to be enabled by hand: `enablement: true` below turns it on
# with "GitHub Actions" as the source the first time this runs. The site then
# lands at https://<user>.github.io/<repo>/.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          mkdir -p _site
          # The app root is the site. Only the browser-facing files are copied:
          # `server/` is a local dev helper and must never be published.
          cp index.html setup.html manifest.json sw.js _site/
          cp -r assets _site/assets
          # Tells Pages not to run Jekyll over the artifact.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Without this the action fails on a repo that has never had Pages
          # enabled ("Get Pages site failed"), which is the default state here.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
